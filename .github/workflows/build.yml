name: Frontend build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Reproducible dependencies from the committed lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Storefront behavior tests
        run: npm test
      - name: Build
        run: npm run build:pages

      - name: Verify SEO HTML and internal links
        run: npm run check:seo
