name: Frontend build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # package-lock.json is currently absent; switch to npm ci after committing it.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
